version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: benchmark_postgres
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: benchmark_redis
    restart: always
    ports:
      - "6379:6379"
